<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=match" />
<meta name="theme-color" content="#0b1026" />
<title>Deep Space · Calculateur RPN hors-ligne</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" />
<style>
:root{
  --bg:#05060f; --panel:#0b1026; --panel2:#121839;
  --line:#24306a;
  --cyan:#33e6ff; --cyan-dim:#157c93;
  --gold:#ffb23e; --violet:#b48bff; --green:#5affc0; --red:#ff5a6e;
  --ink:#e6f1ff; --muted:#5b6b8f;
  --mono:'SF Mono','Fira Code','JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--mono); color:var(--ink);
  background:
    radial-gradient(1200px 640px at 85% -12%, rgba(51,230,255,.12), transparent 60%),
    radial-gradient(900px 520px at 8% 112%, rgba(180,139,255,.12), transparent 60%),
    var(--bg);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(5,6,15,.72));
}
.app{
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ---------- en-tête ---------- */
.bar{
  flex:0 0 auto;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  font-size:clamp(14px,3.4vw,18px); color:var(--cyan);
  padding:12px 14px 6px;
}
.brand{display:flex; align-items:center; gap:10px}
.brand-star{color:var(--gold); animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.bar-right{display:flex; align-items:center; gap:10px}
.status{font-size:10px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.status.on{color:var(--green)} .status.off{color:var(--red)}
.install-btn{
  background:var(--cyan); color:#05101f;
  padding:6px 12px; border:none; border-radius:8px; cursor:pointer;
  font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:.06em;
  box-shadow:0 0 14px rgba(51,230,255,.5);
}

/* ---------- affichage (pile RPN + entrée) ---------- */
.display{
  flex:1 1 0; min-height:0;
  display:flex; flex-direction:column;
  border:1px solid var(--line); border-left:4px solid var(--cyan);
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  box-shadow:inset 0 -22px 26px rgba(5,6,15,.55);
  padding:8px 0;
}
.lines-wrap{flex:1 1 0; min-height:0; display:flex; flex-direction:column; overflow-y:auto}
.lines-inner{display:flex; flex-direction:column; width:100%; gap:5px; padding:6px 14px 8px}
.line{display:flex; align-items:baseline; gap:12px; padding:7px 4px}
.line-idx{color:var(--violet); font-weight:800; font-size:clamp(13px,3.4vw,17px); min-width:2.4ch; text-align:right; letter-spacing:.04em}
.line-val{color:var(--ink); font-weight:700; font-size:clamp(20px,5vw,28px); letter-spacing:.02em; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.line.top .line-val{color:var(--gold)}
.entry{
  flex:0 0 auto;
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; border-top:1px solid var(--line);
  font-family:var(--mono);
}
.entry-caret{color:var(--cyan-dim)}
.entry-val{color:var(--cyan); font-size:clamp(20px,5vw,28px); font-weight:800; min-width:1ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.entry.err{background:rgba(255,90,110,.08)}
.entry.err .entry-val,.entry.err .entry-caret{color:var(--red)}

/* ---------- barre sous-affichage ---------- */
.subbar{
  flex:0 0 auto;
  display:flex; justify-content:space-between; align-items:center;
  font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--muted); padding:4px 14px 4px;
}

/* ---------- légende (si place) ---------- */
.help{
  flex:0 0 auto;
  display:flex; flex-wrap:wrap; justify-content:center; gap:6px 16px;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); padding:4px 14px 2px;
}
.help b{color:var(--cyan); font-weight:800}
@media (max-height: 720px){ .help{display:none} }
@media (max-width: 360px){ .status{display:none} }

/* ---------- clavier ---------- */
.keys{
  flex:0 0 auto;
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:8px; padding:10px 14px 14px;
}
.key{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  min-height:46px;
  border:1px solid var(--line); border-radius:12px; cursor:pointer;
  background:linear-gradient(180deg,var(--panel2),#161c40);
  color:var(--ink); font-family:var(--mono); font-size:clamp(20px,5vw,26px); font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 2px 6px rgba(0,0,0,.35);
}
.key:active{transform:translateY(2px)}
.key .small{font-size:8px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.55; line-height:1}
.key.op{color:var(--cyan); border-color:var(--cyan-dim)}
.key.op:hover{background:rgba(51,230,255,.1); box-shadow:0 0 14px rgba(51,230,255,.3)}
.key.e{color:var(--green); border-color:rgba(90,255,192,.5)}
.key.e:hover{background:rgba(90,255,192,.1)}
.key.danger{color:var(--red); border-color:rgba(255,90,110,.5)}
.key.danger:hover{background:rgba(255,90,110,.1)}
.key.sign{color:var(--violet); border-color:rgba(180,139,255,.5)}
.key.sign:hover{background:rgba(180,139,255,.1)}
.key.menu{color:var(--muted)}
.key.menu:hover{color:var(--violet); border-color:var(--violet)}

/* ---------- menu (sheet) ---------- */
.sheet{position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute; inset:0; background:rgba(5,6,15,.55)}
.sheet-body{
  position:relative; width:100%; max-height:58dvh; overflow-y:auto;
  background:var(--panel); border-top:2px solid var(--cyan);
  padding:16px; box-shadow:0 -10px 30px rgba(0,0,0,.4);
  display:flex; flex-direction:column; gap:10px;
}
.sheet-head{display:flex; justify-content:space-between; align-items:center; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--violet)}
.sheet-close{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1}
.sheet-close:hover{color:var(--red)}
.sheet-item{
  font-family:var(--mono); font-size:clamp(15px,3.4vw,18px); font-weight:700;
  text-align:left; width:100%; padding:12px 14px;
  border:1px solid var(--line); border-radius:10px; cursor:pointer;
  background:linear-gradient(180deg,var(--panel2),#161c40); color:var(--ink);
}
.sheet-item:hover{border-color:var(--cyan-dim); background:rgba(51,230,255,.06)}
.sheet-item.action{color:var(--red); border-color:rgba(255,90,110,.5)}
.sheet-help{font-size:clamp(13px,3vw,15px); line-height:1.75; color:var(--muted); padding:12px; border:1px dashed var(--line); border-radius:10px; background:#0d1230}
.sh{display:flex; gap:10px}
.sk{color:var(--cyan); font-weight:800; min-width:4ch; text-align:right}
.sh-val{text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sheet-version{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="brand-star">✦</span>DEEP&nbsp;SPACE</div>
    <div class="bar-right">
      <button class="install-btn" id="installBtn" hidden>INSTALL</button>
      <div class="status" id="status" aria-live="polite">● …</div>
    </div>
  </header>

  <div class="display" id="display">
    <div class="lines-wrap" id="linesWrap">
      <div class="lines-inner" id="linesInner"></div>
    </div>
    <div class="entry" id="entry">
      <span class="entry-caret">▸</span>
      <span class="entry-val" id="entryVal"></span>
    </div>
  </div>

  <div class="subbar">
    <span>RPN</span>
    <span id="stackCount">STACK 0</span>
  </div>

  <div class="help">
    <span><b>↵</b> enter</span>
    <span><b>C</b> clear</span>
    <span><b>⌫</b> char</span>
    <span><b>±</b> sign</span>
    <span><b>…</b> menu</span>
  </div>

  <div class="keys" id="keys">
    <button class="key sign"  data-a="pm"   type="button">±<span class="small">sign</span></button>
    <button class="key danger" data-a="bs"   type="button">⌫<span class="small">char</span></button>
    <button class="key danger" data-a="c"    type="button">C<span class="small">all</span></button>
    <button class="key menu"   data-a="menu" type="button">…<span class="small">menu</span></button>

    <button class="key"        data-a="digit" data-v="7" type="button">7</button>
    <button class="key"        data-a="digit" data-v="8" type="button">8</button>
    <button class="key"        data-a="digit" data-v="9" type="button">9</button>
    <button class="key op"     data-a="div"  type="button">÷<span class="small">div</span></button>

    <button class="key"        data-a="digit" data-v="4" type="button">4</button>
    <button class="key"        data-a="digit" data-v="5" type="button">5</button>
    <button class="key"        data-a="digit" data-v="6" type="button">6</button>
    <button class="key op"     data-a="mult" type="button">×<span class="small">mul</span></button>

    <button class="key"        data-a="digit" data-v="1" type="button">1</button>
    <button class="key"        data-a="digit" data-v="2" type="button">2</button>
    <button class="key"        data-a="digit" data-v="3" type="button">3</button>
    <button class="key op"     data-a="sub"  type="button">−<span class="small">sub</span></button>

    <button class="key"        data-a="digit" data-v="0" type="button">0</button>
    <button class="key"        data-a="dot"  type="button">.<span class="small">dec</span></button>
    <button class="key e"      data-a="enter" type="button">↵<span class="small">enter</span></button>
    <button class="key op"     data-a="add"  type="button">+<span class="small">add</span></button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <span>MENU</span>
      <button id="sheetClose" class="sheet-close" type="button">✕</button>
    </div>
    <button class="sheet-item action" data-act="clear" type="button">Clear all</button>
    <button class="sheet-item toggle" data-act="help" type="button">Raccourcis</button>
    <div class="sheet-help" id="sheetHelp" hidden>
      <div class="sh"><span class="sk">0–9 · .</span><span class="sh-val">saisir un nombre</span></div>
      <div class="sh"><span class="sk">↵</span><span class="sh-val">valider (ajout à la pile)</span></div>
      <div class="sh"><span class="sk">+ − × ÷</span><span class="sh-val">opérer (RPN)</span></div>
      <div class="sh"><span class="sk">C</span><span class="sh-val">effacement complet</span></div>
      <div class="sh"><span class="sk">⌫</span><span class="sh-val">effacement caract. par caract.</span></div>
      <div class="sh"><span class="sk">±</span><span class="sh-val">changer le signe</span></div>
    </div>
    <div class="sheet-version">Deep Space · RPN v1.0</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var stack=[];
  var entry='';
  var error=false;

  var el={
    linesWrap:document.getElementById('linesWrap'),
    linesInner:document.getElementById('linesInner'),
    entryEl:document.getElementById('entry'),
    entryVal:document.getElementById('entryVal'),
    stackCount:document.getElementById('stackCount'),
    status:document.getElementById('status'),
    installBtn:document.getElementById('installBtn'),
    sheet:document.getElementById('sheet'),
    sheetBackdrop:document.getElementById('sheetBackdrop'),
    sheetClose:document.getElementById('sheetClose'),
    helpPanel:document.getElementById('sheetHelp')
  };

  function fmt(n){
    if(n===null||n===undefined) return '';
    if(!isFinite(n)) return 'ERR';
    if(Math.abs(n)>=1e16 || Math.abs(n)<1e-15) return n.toExponential(3);
    var s = String(+parseFloat(n.toPrecision(12)));
    if(s==='-0') s='0';
    return s;
  }

  function render(){
    var inner=el.linesInner;
    inner.innerHTML='';
    var n=stack.length;
    for(var i=n-1;i>=0;i--){
      var row=document.createElement('div');
      row.className='line'+(i===n-1?' top':'');
      var idx=document.createElement('span'); idx.className='line-idx'; idx.textContent=(i+1)+':';
      var val=document.createElement('span'); val.className='line-val'; val.textContent=fmt(stack[i]);
      row.appendChild(idx); row.appendChild(val);
      inner.appendChild(row);
    }
    el.entryVal.textContent = error?'ERR':(entry===''?'…':entry);
    el.entryEl.classList.toggle('err',error);
    el.stackCount.textContent='STACK '+n;
    el.linesWrap.scrollTop = 0;
  }

  function flashError(){ error=true; render(); }
  function resetError(){ error=false; }

  function keyInput(ch){
    resetError();
    if(ch==='.'){
      if(entry.indexOf('.')>=0) return;
      entry = (entry===''?'0.':entry)+ch;
    } else {
      if(entry===''){ entry=ch; }
      else if(entry==='0'){ entry=ch; }
      else if(entry==='-0'){ entry='-'+ch; }
      else { entry+=ch; }
    }
    render();
  }

  function commitEntry(){
    if(entry===''){ resetError(); return; }
    var n=parseFloat(entry);
    if(!isNaN(n)){ stack.push(n); entry=''; resetError(); render(); }
    else { resetError(); }
  }

  function doOp(op){
    if(entry!==''){ commitEntry(); }
    resetError();
    if(stack.length<2){ flashError(); return; }
    var b=stack[stack.length-1];
    var a=stack[stack.length-2];
    if(op==='div' && b===0){ flashError(); return; }
    var r;
    if(op==='add') r=a+b;
    else if(op==='sub') r=a-b;
    else if(op==='mult') r=a*b;
    else r=a/b;
    stack.pop(); stack.pop();
    stack.push(r);
    render();
  }

  function clearAll(){ stack=[]; entry=''; resetError(); render(); }

  function backspace(){
    resetError();
    if(entry.length>0){ entry=entry.slice(0,-1); }
    if(entry==='.'){ entry=''; }
    render();
  }

  function toggleSign(){
    resetError();
    if(entry===''){ return; }
    entry = (entry.charAt(0)==='-') ? entry.slice(1) : '-'+entry;
    render();
  }

  document.getElementById('keys').addEventListener('click',function(e){
    var btn=e.target.closest('.key'); if(!btn) return;
    var a=btn.dataset.a;
    if(a==='digit'){ keyInput(btn.dataset.v); }
    else if(a==='dot'){ keyInput('.'); }
    else if(a==='add'){ doOp('add'); }
    else if(a==='sub'){ doOp('sub'); }
    else if(a==='mult'){ doOp('mult'); }
    else if(a==='div'){ doOp('div'); }
    else if(a==='enter'){ commitEntry(); }
    else if(a==='c'){ clearAll(); }
    else if(a==='bs'){ backspace(); }
    else if(a==='pm'){ toggleSign(); }
    else if(a==='menu'){ toggleSheet(); }
  });

  window.addEventListener('keydown',function(e){
    if(!el.sheet.hidden){
      if(e.key==='Escape'){ closeSheet(); }
      return;
    }
    var k=e.key;
    if(/[0-9]/.test(k)){ keyInput(k); }
    else if(k==='.'||k===','){ e.preventDefault(); keyInput('.'); }
    else if(k==='+'){ e.preventDefault(); doOp('add'); }
    else if(k==='-'){ e.preventDefault(); doOp('sub'); }
    else if(k==='*'||k==='/'||k==='x'){ e.preventDefault(); doOp(k==='x'?'mult':'div'); }
    else if(k==='c'||k==='C'){ e.preventDefault(); clearAll(); }
    else if(k==='Backspace'){ e.preventDefault(); backspace(); }
    else if(k==='Enter'){ e.preventDefault(); commitEntry(); }
  });

  function openSheet(){ el.sheet.hidden=false; }
  function closeSheet(){ el.sheet.hidden=true; }
  function toggleSheet(){ el.sheet.hidden ? openSheet() : closeSheet(); }
  el.sheetClose.addEventListener('click',closeSheet);
  el.sheetBackdrop.addEventListener('click',closeSheet);
  el.sheet.addEventListener('click',function(e){
    if(e.target===el.sheet && !e.target.classList.contains('sheet-body')) return closeSheet();
    var item=e.target.closest('.sheet-item');
    if(!item) return;
    if(item.dataset.act==='clear'){ clearAll(); closeSheet(); }
    else if(item.dataset.act==='help'){ el.helpPanel.hidden=!el.helpPanel.hidden; }
  });

  function setOnline(){
    var on=navigator.onLine;
    el.status.className='status '+(on?'on':'off');
    el.status.textContent='● '+(on?'ONLINE':'OFFLINE');
  }
  window.addEventListener('online',setOnline);
  window.addEventListener('offline',setOnline);
  setOnline();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  if('beforeinstallprompt' in window){
    window.addEventListener('beforeinstallprompt',function(ev){
      ev.preventDefault();
      el.installBtn.hidden=false;
      el.installBtn.addEventListener('click',function(){ ev.prompt(); });
    });
  }

  render();
})();
</script>
</body>
</html>
